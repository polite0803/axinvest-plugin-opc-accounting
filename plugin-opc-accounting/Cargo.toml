# 会计域包插件 worker：独立身份、独立命令清单。

[package]
name = "axagent-plugin-opc-accounting"
version = "3.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "OPC accounting 域包 worker：发票列表 / 创建 / 状态变更"

[[bin]]
name = "axagent-plugin-opc-accounting"
path = "src/main.rs"

[dependencies]
axagent-plugin-opc-core = { version = "3.0.0", path = "../sdk/plugin-opc-core" }
axagent-plugin-proto = { version = "3.0.0", path = "../sdk/plugin-proto" }
serde_json = "1"

[dev-dependencies]
axagent-plugin-testkit = { version = "3.0.0", path = "../sdk/plugin-testkit" }

